[project]
name = "read-instruments"
version = "0.1.0"
description = "Readers for Aquatic Physics group instruments (EXO2, LGR, GPS, mooring loggers; Seabird and Picarro planned)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=7.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
